<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 光影驿站 - 电影推介</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #141420;
            --surface2: #1a1a2e;
            --gold: #f0c060;
            --gold-dark: #c8963e;
            --accent: #e8596b;
            --text: #e0dcd0;
            --text-dim: #908b7a;
            --text-bright: #faf7f0;
            --border: #2a2835;
            --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.6);
            --shadow-card: 0 8px 28px rgba(0, 0, 0, 0.45);
            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(232, 89, 107, 0.04) 0%, transparent 55%),
                radial-gradient(ellipse at 75% 60%, rgba(240, 192, 96, 0.05) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 80%, rgba(100, 130, 220, 0.03) 0%, transparent 55%);
            pointer-events: none;
            z-index: 0;
        }

        .app-container {
            position: relative;
            z-index: 1;
            max-width: 1300px;
            margin: 0 auto;
            padding: 20px 24px 60px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px 0 30px;
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 15, 0.82);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid transparent;
            transition: border-color 0.4s;
        }
        .header.scrolled {
            border-bottom-color: var(--border);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.7rem;
            font-weight: 800;
            color: var(--text-bright);
            cursor: pointer;
            user-select: none;
            transition: var(--transition);
        }
        .logo:hover {
            color: var(--gold);
        }
        .logo-icon {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--gold), var(--accent));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 6px 20px rgba(240, 192, 96, 0.3);
            flex-shrink: 0;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: var(--surface2);
            border-radius: 50px;
            padding: 6px 8px 6px 18px;
            border: 2px solid transparent;
            transition: var(--transition);
            gap: 6px;
            flex: 1;
            max-width: 380px;
            min-width: 220px;
        }
        .search-box:focus-within {
            border-color: var(--gold);
            box-shadow: 0 0 0 6px rgba(240, 192, 96, 0.08);
            background: var(--surface);
        }
        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-bright);
            font-size: 0.95rem;
            width: 100%;
            padding: 8px 0;
            font-family: inherit;
        }
        .search-box input::placeholder {
            color: var(--text-dim);
            opacity: 0.7;
        }
        .search-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: var(--gold);
            color: #1a1a10;
            cursor: pointer;
            font-size: 1.1rem;
            flex-shrink: 0;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .search-btn:hover {
            background: #f5d080;
            transform: scale(1.05);
            box-shadow: 0 4px 16px rgba(240, 192, 96, 0.35);
        }

        .category-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 32px;
            padding-top: 8px;
        }
        .cat-tag {
            padding: 10px 20px;
            border-radius: 50px;
            border: 1.5px solid var(--border);
            background: transparent;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            transition: var(--transition);
            white-space: nowrap;
            font-family: inherit;
            user-select: none;
        }
        .cat-tag:hover {
            border-color: #5a5560;
            color: var(--text);
            background: rgba(255, 255, 255, 0.02);
        }
        .cat-tag.active {
            background: var(--gold);
            color: #1a1a10;
            border-color: var(--gold);
            font-weight: 600;
            box-shadow: 0 4px 16px rgba(240, 192, 96, 0.3);
            transform: translateY(-1px);
        }
        .cat-count {
            font-size: 0.75rem;
            opacity: 0.7;
            margin-left: 4px;
        }
        .cat-tag.active .cat-count {
            opacity: 1;
        }

        .stats-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
            font-size: 0.88rem;
            color: var(--text-dim);
        }
        .stats-bar strong {
            color: var(--gold);
            font-weight: 600;
        }
        .sort-btn {
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 16px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: var(--transition);
            font-family: inherit;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sort-btn:hover {
            border-color: #5a5560;
            background: var(--surface);
        }
        .sort-btn.active-sort {
            border-color: var(--gold);
            color: var(--gold);
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
        }

        .movie-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            overflow: hidden;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid var(--border);
            position: relative;
            box-shadow: var(--shadow-card);
            display: flex;
            flex-direction: column;
        }
        .movie-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-lg), 0 0 0 1px rgba(240, 192, 96, 0.15);
            border-color: #3a3545;
        }

        .movie-poster {
            position: relative;
            aspect-ratio: 2 / 3;
            overflow: hidden;
            background: var(--surface2);
            flex-shrink: 0;
        }
        .movie-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            display: block;
        }
        .movie-card:hover .movie-poster img {
            transform: scale(1.07);
        }
        .poster-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(10, 10, 15, 0.9) 0%, transparent 50%, transparent 100%);
            pointer-events: none;
        }
        .movie-rating-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            color: var(--gold);
            padding: 6px 12px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.85rem;
            z-index: 2;
            border: 1px solid rgba(240, 192, 96, 0.3);
        }

        .movie-info {
            padding: 16px 18px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }
        .movie-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-bright);
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .movie-meta {
            display: flex;
            gap: 12px;
            font-size: 0.8rem;
            color: var(--text-dim);
            flex-wrap: wrap;
        }
        .movie-desc {
            font-size: 0.84rem;
            color: var(--text-dim);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.5;
        }
        .movie-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: auto;
            padding-top: 4px;
        }
        .movie-tag {
            font-size: 0.73rem;
            padding: 4px 10px;
            border-radius: 50px;
            background: var(--surface2);
            color: var(--text-dim);
            white-space: nowrap;
            border: 1px solid transparent;
            transition: var(--transition);
        }
        .movie-card:hover .movie-tag {
            border-color: #3a3545;
        }
        .movie-tag.genre {
            background: rgba(232, 89, 107, 0.12);
            color: #f0909e;
            border-color: rgba(232, 89, 107, 0.25);
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 999;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-dialog {
            background: var(--surface);
            border-radius: var(--radius-lg);
            max-width: 700px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
            position: relative;
            transform: translateY(30px) scale(0.96);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .modal-overlay.active .modal-dialog {
            transform: translateY(0) scale(1);
        }
        .modal-close {
            position: sticky;
            top: 12px;
            float: right;
            z-index: 10;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            color: #fff;
            font-size: 1.3rem;
            cursor: pointer;
            margin: 8px 12px;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-close:hover {
            background: rgba(232, 89, 107, 0.7);
            transform: rotate(90deg);
        }
        .modal-poster {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            display: block;
        }
        .modal-body {
            padding: 24px 28px 32px;
        }
        .modal-body h2 {
            font-size: 1.6rem;
            color: var(--text-bright);
            margin-bottom: 8px;
        }
        .modal-body .modal-meta {
            color: var(--text-dim);
            font-size: 0.88rem;
            margin-bottom: 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
        }
        .modal-body .modal-desc {
            color: var(--text);
            line-height: 1.8;
            font-size: 0.95rem;
            margin-bottom: 16px;
        }
        .modal-highlight {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            background: var(--surface2);
            border-radius: var(--radius-md);
            padding: 16px 20px;
            border: 1px solid var(--border);
        }
        .hl-item {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .hl-label {
            font-size: 0.73rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .hl-value {
            font-weight: 600;
            color: var(--gold);
            font-size: 0.95rem;
        }

        .watch-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 12px 22px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 0.95rem;
            text-decoration: none;
            transition: var(--transition);
            letter-spacing: 0.03em;
            border: none;
            cursor: pointer;
            background: linear-gradient(135deg, #e8596b, #c0392b);
            color: #fff;
            box-shadow: 0 6px 18px rgba(232, 89, 107, 0.4);
        }
        .watch-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(232, 89, 107, 0.55);
            filter: brightness(1.1);
        }
        .trailer-btn {
            background: linear-gradient(135deg, #3a3a4a, #1f1f2e);
            color: #f0c060;
            border: 1px solid #5a5560;
            box-shadow: 0 4px 14px rgba(0,0,0,0.4);
        }
        .trailer-btn:hover {
            border-color: #f0c060;
            box-shadow: 0 6px 20px rgba(240,192,96,0.25);
            filter: brightness(1.15);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-dim);
            grid-column: 1 / -1;
        }
        .empty-state .empty-icon {
            font-size: 4rem;
            margin-bottom: 16px;
            opacity: 0.6;
        }

        .footer {
            text-align: center;
            padding: 40px 20px 20px;
            color: var(--text-dim);
            font-size: 0.8rem;
            opacity: 0.7;
        }
        .footer span {
            color: var(--gold);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #3a3545;
            border-radius: 20px;
        }

        @media (max-width: 768px) {
            .header {
                padding: 12px 0 20px;
                gap: 12px;
            }
            .logo {
                font-size: 1.35rem;
            }
            .logo-icon {
                width: 36px;
                height: 36px;
                font-size: 1.2rem;
            }
            .search-box {
                max-width: 100%;
                order: 3;
                flex: 1 1 100%;
            }
            .movie-grid {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
                gap: 16px;
            }
            .cat-tag {
                padding: 8px 14px;
                font-size: 0.8rem;
            }
            .modal-body {
                padding: 16px 18px 24px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header class="header" id="header">
            <div class="logo" onclick="resetAll()">
                <div class="logo-icon">🎬</div>
                光影驿站
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜索电影名称、导演、类型..." oninput="handleSearch()">
                <button class="search-btn" onclick="handleSearch()" aria-label="搜索">🔍</button>
            </div>
        </header>

        <div class="category-tabs" id="categoryTabs">
            <button class="cat-tag active" data-category
