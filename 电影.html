<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 光影驿站 - 电影推介</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #141420;
            --surface2: #1a1a2e;
            --gold: #f0c060;
            --accent: #e8596b;
            --text: #e0dcd0;
            --text-dim: #908b7a;
            --text-bright: #faf7f0;
            --border: #2a2835;
            --shadow-lg: 0 20px 50px rgba(0,0,0,0.6);
            --shadow-card: 0 8px 28px rgba(0,0,0,0.45);
            --radius-lg: 20px;
            --radius-md: 14px;
            --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        html{scroll-behavior:smooth;}
        body{
            font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
            background:var(--bg);color:var(--text);line-height:1.6;
            min-height:100vh;overflow-x:hidden;
        }
        body::before{
            content:'';position:fixed;inset:0;
            background:radial-gradient(ellipse at 20% 20%,rgba(232,89,107,0.04) 0%,transparent 55%),
                       radial-gradient(ellipse at 75% 60%,rgba(240,192,96,0.05) 0%,transparent 55%);
            pointer-events:none;z-index:0;
        }
        .app-container{position:relative;z-index:1;max-width:1300px;margin:0 auto;padding:20px 24px 60px;}
        .header{
            display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;
            gap:20px;padding:20px 0 30px;position:sticky;top:0;z-index:100;
            background:rgba(10,10,15,0.82);backdrop-filter:blur(20px);
        }
        .logo{
            display:flex;align-items:center;gap:12px;font-size:1.7rem;
            font-weight:800;color:var(--text-bright);cursor:pointer;
        }
        .logo:hover{color:var(--gold);}
        .logo-icon{
            width:44px;height:44px;border-radius:10px;
            background:linear-gradient(135deg,var(--gold),var(--accent));
            display:flex;align-items:center;justify-content:center;font-size:1.5rem;
        }
        .search-box{
            display:flex;align-items:center;background:var(--surface2);
            border-radius:50px;padding:6px 8px 6px 18px;border:2px solid transparent;
            gap:6px;flex:1;max-width:380px;min-width:220px;
        }
        .search-box:focus-within{border-color:var(--gold);}
        .search-box input{
            background:transparent;border:none;outline:none;
            color:var(--text-bright);font-size:0.95rem;width:100%;padding:8px 0;
        }
        .search-btn{
            width:40px;height:40px;border-radius:50%;border:none;
            background:var(--gold);color:#1a1a10;cursor:pointer;font-size:1.1rem;
        }
        .category-tabs{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 32px;}
        .cat-tag{
            padding:10px 20px;border-radius:50px;border:1.5px solid var(--border);
            background:transparent;color:var(--text-dim);cursor:pointer;
            font-size:0.9rem;transition:var(--transition);
        }
        .cat-tag.active{
            background:var(--gold);color:#1a1a10;border-color:var(--gold);font-weight:600;
        }
        .stats-bar{
            display:flex;justify-content:space-between;align-items:center;
            margin-bottom:24px;color:var(--text-dim);
        }
        .stats-bar strong{color:var(--gold);}
        .sort-btn{
            background:var(--surface2);border:1px solid var(--border);
            color:var(--text);padding:8px 16px;border-radius:50px;cursor:pointer;
        }
        .movie-grid{
            display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:24px;
        }
        .movie-card{
            background:var(--surface);border-radius:20px;overflow:hidden;
            cursor:pointer;transition:var(--transition);border:1px solid var(--border);
            box-shadow:var(--shadow-card);
        }
        .movie-card:hover{transform:translateY(-8px);}
        .movie-poster{
            aspect-ratio:2/3;overflow:hidden;background:var(--surface2);
        }
        .movie-poster img{width:100%;height:100%;object-fit:cover;}
        .movie-card:hover .movie-poster img{transform:scale(1.07);}
        .movie-rating-badge{
            position:absolute;top:12px;right:12px;
            background:rgba(0,0,0,0.7);color:var(--gold);
            padding:6px 12px;border-radius:50px;font-weight:700;
        }
        .movie-info{padding:16px 18px 20px;}
        .movie-title{font-size:1.15rem;font-weight:700;color:var(--text-bright);}
        .movie-meta{font-size:0.8rem;color:var(--text-dim);margin:6px 0;}
        .movie-desc{font-size:0.84rem;color:var(--text-dim);}
        .movie-tags{display:flex;gap:6px;margin-top:8px;}
        .movie-tag{
            font-size:0.73rem;padding:4px 10px;border-radius:50px;
            background:var(--surface2);color:var(--text-dim);
        }
        .movie-tag.genre{background:rgba(232,89,107,0.2);color:#f0909e;}
        .modal-overlay{
            position:fixed;inset:0;z-index:999;background:rgba(0,0,0,0.75);
            backdrop-filter:blur(8px);display:flex;align-items:center;
            justify-content:center;padding:20px;
            opacity:0;pointer-events:none;transition:opacity 0.35s;
        }
        .modal-overlay.active{opacity:1;pointer-events:auto;}
        .modal-dialog{
            background:var(--surface);border-radius:20px;max-width:700px;
            width:100%;max-height:85vh;overflow-y:auto;
        }
        .modal-close{
            position:sticky;top:12px;float:right;z-index:10;
            width:40px;height:40px;border-radius:50%;border:none;
            background:rgba(0,0,0,0.6);color:#fff;font-size:1.3rem;
            cursor:pointer;margin:8px 12px;
        }
        .modal-poster{
            width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:20px 20px 0 0;
        }
        .modal-body{padding:24px 28px 32px;}
        .modal-body h2{font-size:1.6rem;color:var(--text-bright);}
        .modal-body .modal-meta{color:var(--text-dim);margin:10px 0;}
        .modal-body .modal-desc{color:var(--text);line-height:1.8;}
        .modal-highlight{
            display:flex;gap:16px;background:var(--surface2);
            padding:16px 20px;border-radius:14px;margin-bottom:16px;
        }
        .hl-item{display:flex;flex-direction:column;}
        .hl-label{font-size:0.73rem;color:var(--text-dim);}
        .hl-value{font-weight:600;color:var(--gold);}
        .watch-btn{
            display:inline-flex;align-items:center;gap:6px;
            padding:12px 22px;border-radius:50px;font-weight:700;
            text-decoration:none;cursor:pointer;
            background:linear-gradient(135deg,#e8596b,#c0392b);color:#fff;
        }
        .trailer-btn{
            background:linear-gradient(135deg,#3a3a4a,#1f1f2e);
            color:#f0c060;border:1px solid #5a5560;
        }
        .empty-state{text-align:center;padding:60px;color:var(--text-dim);}
        .footer{text-align:center;padding:40px;color:var(--text-dim);}
    </style>
</head>
<body>
    <div class="app-container">
        <header class="header">
            <div class="logo" onclick="resetAll()">
                <div class="logo-icon">🎬</div>
                光影驿站
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜索电影..." oninput="handleSearch()">
                <button class="search-btn" onclick="handleSearch()">🔍</button>
            </div>
        </header>

        <div class="category-tabs" id="categoryTabs">
            <button class="cat-tag active" data-category="all">全部</button>
            <button class="cat-tag" data-category="动作">动作</button>
            <button class="cat-tag" data-category="科幻">科幻</button>
            <button class="cat-tag" data-category="爱情">爱情</button>
            <button class="cat-tag" data-category="动画">动画</button>
            <button class="cat-tag" data-category="悬疑">悬疑</button>
            <button class="cat-tag" data-category="喜剧">喜剧</button>
            <button class="cat-tag" data-category="剧情">剧情</button>
        </div>

        <div class="stats-bar">
            <span>共 <strong id="movieCount">0</strong> 部电影</span>
            <button class="sort-btn" onclick="toggleSort()">📊 按评分排序</button>
        </div>

        <div class="movie-grid" id="movieGrid"></div>
        <div class="empty-state" id="emptyState" style="display:none;">
            <p>🎞️ 没有找到匹配的电影</p>
        </div>
        <div class="footer">✨ 光影驿站 · 发现好电影 ✨</div>
    </div>

    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
        <div class="modal-dialog" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <img class="modal-poster" id="modalPoster" src="">
            <div class="modal-body">
                <h2 id="modalTitle"></h2>
                <div class="modal-meta" id="modalMeta"></div>
                <p class="modal-desc" id="modalDesc"></p>
                <div class="modal-highlight" id="modalHighlight"></div>
                <div style="display:flex;gap:12px;margin-top:18px;">
                    <a id="watchBtn" href="#" target="_blank" class="watch-btn" style="display:none;">▶️ 立即观看</a>
                    <a id="trailerBtn" href="#" target="_blank" class="watch-btn trailer-btn" style="display:none;">🎬 预告片</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ========== 电影数据（直接在这里添加） ==========
        const movies = [
            {
                id:1,title:'星际穿越',originalTitle:'Interstellar',year:2014,rating:9.4,
                director:'克里斯托弗·诺兰',category:'科幻',duration:'169分钟',country:'美国',
                poster:'https://picsum.photos/seed/interstellar/400/600',
                banner:'https://picsum.photos/seed/interstellar-banner/900/400',
                desc:'在地球资源逐渐枯竭的未来，前NASA宇航员库珀被选中参加一项穿越虫洞的星际任务，为人类寻找新的家园。',
                tags:['太空','时间旅行','亲情','硬科幻'],
                highlight:{'IMDb':'8.7','豆瓣':'9.4','奥斯卡':'最佳视觉效果'},
                watchUrl:'',trailerUrl:''
            },
            {
                id:2,title:'肖申克的救赎',originalTitle:'The Shawshank Redemption',year:1994,rating:9.7,
                director:'弗兰克·德拉邦特',category:'剧情',duration:'142分钟',country:'美国',
                poster:'https://picsum.photos/seed/shawshank/400/600',
                banner:'https://picsum.photos/seed/shawshank-banner/900/400',
                desc:'银行家安迪因被误判谋杀妻子而关进肖申克监狱。他用智慧与毅力赢得了尊重，也悄然筹划着惊天越狱。',
                tags:['监狱','希望','友情','经典'],
                highlight:{'IMDb':'9.3','豆瓣':'9.7','地位':'影史TOP1'},
                watchUrl:'',trailerUrl:''
            },
            {
                id:3,title:'你的名字。',originalTitle:'君の名は。',year:2016,rating:8.8,
                director:'新海诚',category:'动画',duration:'106分钟',country:'日本',
                poster:'https://picsum.photos/seed/yourname/400/600',
                banner:'https://picsum.photos/seed/yourname-banner/900/400',
                desc:'生活在乡下的三叶与东京高中生泷，在某天醒来后发现自己与对方互换了身体。',
                tags:['纯爱','时空','青春','催泪'],
                highlight:{'豆瓣':'8.8','票房':'全球3.6亿美元'},
                watchUrl:'',trailerUrl:''
            },
            {
                id:4,title:'盗梦空间',originalTitle:'Inception',year:2010,rating:9.3,
                director:'克里斯托弗·诺兰',category:'科幻',duration:'148分钟',country:'美国',
                poster:'https://picsum.photos/seed/inception/400/600',
                banner:'https://picsum.photos/seed/inception-banner/900/400',
                desc:'道姆·柯布是一名"盗梦者"，能够潜入他人梦境窃取机密。层层嵌套的梦境，诺兰再次挑战观众的大脑极限。',
                tags:['梦境','悬疑','动作','烧脑'],
                highlight:{'IMDb':'8.8','豆瓣':'9.3','奥斯卡':'4项大奖'},
                watchUrl:'',trailerUrl:''
            },
            {
                id:5,title:'泰坦尼克号',originalTitle:'Titanic',year:1997,rating:9.1,
                director:'詹姆斯·卡梅隆',category:'爱情',duration:'194分钟',country:'美国',
                poster:'https://picsum.photos/seed/titanic/400/600',
                banner:'https://picsum.photos/seed/titanic-banner/900/400',
                desc:'穷画家杰克与贵族少女露丝在泰坦尼克号上相遇相恋，成为影史永恒的经典。',
                tags:['灾难','浪漫','经典','史诗'],
                highlight:{'IMDb':'7.9','豆瓣':'9.1','奥斯卡':'11项大奖'},
                watchUrl:'',trailerUrl:''
            },
            {
                id:6,title:'疯狂动物城',originalTitle:'Zootopia',year:2016,rating:8.9,
                director:'拜伦·霍华德',category:'动画',duration:'109分钟',country:'美国',
                poster:'https://picsum.photos/seed/zootopia/400/600',
                banner:'https://picsum.photos/seed/zootopia-banner/900/400',
                desc:'小兔子朱迪实现了当警察的梦想，与狐狸尼克搭档破获神秘案件。',
                tags:['冒险','喜剧','社会','迪士尼'],
                highlight:{'豆瓣':'8.9','奥斯卡':'最佳动画长片'},
                watchUrl:'',trailerUrl:''
            },
            {
                id:7,title:'看不见的客人',originalTitle:'Contratiempo',year:2016,rating:9.0,
                director:'奥里奥尔·保罗',category:'悬疑',duration:'106分钟',country:'西班牙',
                poster:'https://picsum.photos/seed/contratiempo/400/600',
                banner:'https://picsum.photos/seed/contratiempo-banner/900/400',
                desc:'企业家阿德里安被指控谋杀情人，在开庭前夜的对话中，真相与谎言层层交织。',
                tags:['反转','犯罪','推理'],
                highlight:{'豆瓣':'9.0','口碑':'悬疑神作'},
                watchUrl:'',trailerUrl:''
            },
            {
                id:8,title:'功夫',originalTitle:'Kung Fu Hustle',year:2004,rating:8.8,
                director:'周星驰',category:'喜剧',duration:'99分钟',country:'中国香港',
                poster:'https://picsum.photos/seed/kungfu/400/600',
                banner:'https://picsum.photos/seed/kungfu-banner/900/400',
                desc:'小混混阿星误闯猪笼城寨，卷入了斧头帮与隐藏高手之间的对决。',
                tags:['功夫','无厘头','周星驰'],
                highlight:{'豆瓣':'8.8','金像奖':'最佳影片'},
                watchUrl:'',trailerUrl:''
            }
        ];

        // ========== 主逻辑 ==========
        let currentCategory = 'all';
        let searchQuery = '';
        let sortByRating = false;

        function getFilteredMovies() {
            let filtered = [...movies];
            if (currentCategory !== 'all') {
                filtered = filtered.filter(m => m.category === currentCategory);
            }
            if (searchQuery.trim()) {
                const q = searchQuery.trim().toLowerCase();
                filtered = filtered.filter(m =>
                    m.title.toLowerCase().includes(q) ||
                    m.director.toLowerCase().includes(q) ||
                    m.category.toLowerCase().includes(q) ||
                    m.tags.some(t => t.toLowerCase().includes(q))
                );
            }
            if (sortByRating) {
                filtered.sort((a, b) => b.rating - a.rating);
            }
            return filtered;
        }

        function renderMovies() {
            const filtered = getFilteredMovies();
            document.getElementById('movieCount').textContent = filtered.length;
            
            if (filtered.length === 0) {
                document.getElementById('movieGrid').innerHTML = '';
                document.getElementById('emptyState').style.display = 'block';
            } else {
                document.getElementById('emptyState').style.display = 'none';
                document.getElementById('movieGrid').innerHTML = filtered.map(m => `
                    <div class="movie-card" onclick="openDetail(${m.id})" style="position:relative;">
                        <div class="movie-poster">
                            <img src="${m.poster}" alt="${m.title}" onerror="this.src='https://picsum.photos/400/600'">
                            <div class="movie-rating-badge">⭐${m.rating}</div>
                        </div>
                        <div class="movie-info">
                            <div class="movie-title">${m.title}</div>
                            <div class="movie-meta">📅${m.year} 🎬${m.director}</div>
                            <div class="movie-desc">${m.desc}</div>
                            <div class="movie-tags">
                                <span class="movie-tag genre">${m.category}</span>
                                ${m.tags.slice(0,2).map(t => `<span class="movie-tag">#${t}</span>`).join('')}
                            </div>
                        </div>
                    </div>
                `).join('');
            }
        }

        function handleSearch() {
            searchQuery = document.getElementById('searchInput').value;
            renderMovies();
        }

        document.getElementById('categoryTabs').addEventListener('click', function(e) {
            const tag = e.target.closest('.cat-tag');
            if (!tag) return;
            document.querySelectorAll('.cat-tag').forEach(t => t.classList.remove('active'));
            tag.classList.add('active');
            currentCategory = tag.dataset.category;
            renderMovies();
        });

        function toggleSort() {
            sortByRating = !sortByRating;
            renderMovies();
        }

        function openDetail(id) {
            const m = movies.find(x => x.id === id);
            if (!m) return;
            document.getElementById('modalPoster').src = m.banner;
            document.getElementById('modalTitle').textContent = m.title + (m.originalTitle ? ' (' + m.originalTitle + ')' : '');
            document.getElementById('modalMeta').innerHTML = `⭐${m.rating}分 📅${m.year} ⏱️${m.duration} 🌍${m.country} 🎬${m.director}`;
            document.getElementById('modalDesc').textContent = m.desc;
            document.getElementById('modalHighlight').innerHTML = Object.entries(m.highlight)
                .map(([k,v]) => `<div class="hl-item"><span class="hl-label">${k}</span><span class="hl-value">${v}</span></div>`).join('');
            
            const wb = document.getElementById('watchBtn');
            const tb = document.getElementById('trailerBtn');
            wb.style.display = m.watchUrl ? 'inline-flex' : 'none';
            tb.style.display = m.trailerUrl ? 'inline-flex' : 'none';
            if(m.watchUrl) wb.href = m.watchUrl;
            if(m.trailerUrl) tb.href = m.trailerUrl;
            
            document.getElementById('modalOverlay').classList.add('active');
        }

        function closeModal(event) {
            if (event && event.target !== document.getElementById('modalOverlay')) return;
            document.getElementById('modalOverlay').classList.remove('active');
        }

        function resetAll() {
            currentCategory = 'all';
            searchQuery = '';
            sortByRating = false;
            document.getElementById('searchInput').value = '';
            document.querySelectorAll('.cat-tag').forEach(t => t.classList.remove('active'));
            document.querySelector('.cat-tag[data-category="all"]').classList.add('active');
            renderMovies();
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') document.getElementById('modalOverlay').classList.remove('active');
        });

        renderMovies();
    </script>
</body>
</html>
